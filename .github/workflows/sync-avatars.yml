# Daily refresh of local X avatar fallbacks (public/avatars).
# Only commits when a photo's bytes actually changed — no spam deploys.
name: Sync avatars

on:
  schedule:
    # Once a day, 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync avatars
        run: npm run sync:avatars

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/avatars; then
            echo "No avatar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars
          git commit -m "chore: sync staff X avatars"
          git push
